<style id="pg-style">
/* Layout: dark slate studio hero that matches the portrait background, then calm light sections; a patch-panel strip of port lights nods to networking. */
:root{
  --bg:#f3f4f7; --surface:#ffffff; --ink:#12161d; --muted:#566070; --line:#d8dce4;
  --accent:#c8480a; --accent-ink:#ffffff; --accent-text:#ad3f08; --blue:#3446b8;
  --slate:#272e35; --on-slate:#f2f3f5; --on-slate-muted:#b4bbc6; --port-off:#3a434d;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Figtree','Segoe UI',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f131a; --surface:#171c25; --ink:#eef0f4; --muted:#a3abb8; --line:#2a313c;
    --accent:#ff8d45; --accent-ink:#1a0d04; --accent-text:#ff9d5e; --blue:#9aa8ff;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f131a; --surface:#171c25; --ink:#eef0f4; --muted:#a3abb8; --line:#2a313c;
  --accent:#ff8d45; --accent-ink:#1a0d04; --accent-text:#ff9d5e; --blue:#9aa8ff;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;scroll-padding-top:7rem}
body{background:var(--bg);color:var(--ink);font:400 1rem/1.6 var(--f-body);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3{font-family:var(--f-display);line-height:1.1;margin:0;text-wrap:balance}
p{margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:3px}
.wrap{width:100%;max-width:70rem;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.12em;text-transform:uppercase}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem 1rem;padding-block:.7rem}
.brand{display:flex;align-items:center;gap:.6rem;text-decoration:none;font-family:var(--f-display);font-weight:700;font-size:1.05rem;margin-right:auto}
.brand b{display:grid;place-items:center;width:2.1rem;height:2.1rem;background:var(--ink);color:var(--bg);border-radius:.3rem;font-size:.9rem;letter-spacing:.02em}
.nav{display:flex;gap:.25rem;order:3;width:100%;overflow-x:auto;scrollbar-width:none;margin-inline:-.4rem;padding-inline:.4rem}
.nav::-webkit-scrollbar{display:none}
.nav a{white-space:nowrap;text-decoration:none;font-weight:600;font-size:.92rem;color:var(--muted);padding:.4rem .7rem;border-radius:.4rem}
.nav a:hover{color:var(--ink);background:var(--surface)}
@media (min-width:56rem){.nav{order:0;width:auto;margin:0;padding:0}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.8rem 1.3rem;border-radius:.5rem;border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);font:700 1rem/1.2 var(--f-body);text-decoration:none;cursor:pointer}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:inherit;border-color:currentColor}
.btn.sm{padding:.5rem .95rem;font-size:.92rem}
.btn[aria-disabled="true"]{opacity:.55}
.btn svg{width:1.1em;height:1.1em;flex:none}

/* hero */
.hero{background:var(--slate);color:var(--on-slate)}
.hero-grid{display:grid;gap:1.5rem;align-items:end;padding-top:2.5rem}
.hero-copy{display:flex;flex-direction:column;gap:1.1rem;align-items:flex-start;padding-bottom:1rem}
.hero .mono{color:var(--on-slate-muted)}
.hero h1{font-size:clamp(2.9rem,12vw,5.6rem);font-weight:700;letter-spacing:-.02em}
.hero-sub{font-size:clamp(1.1rem,3.6vw,1.4rem);max-width:30rem;color:var(--on-slate)}
.pill{display:inline-flex;align-items:center;gap:.55rem;font:600 .85rem var(--f-body);color:var(--on-slate);border:1px solid #4a5560;border-radius:99px;padding:.3rem .8rem}
.pill i{width:.55rem;height:.55rem;border-radius:50%;background:#58d68d}
.pill.off i{background:#8a94a1}
.hero-cta{display:flex;flex-wrap:wrap;gap:.7rem}
.hero .btn.ghost{color:var(--on-slate)}
.hero-photo{margin:0;justify-self:center;width:100%;max-width:26rem}
.hero-photo img{display:block;width:100%;height:auto;max-height:38rem;object-fit:cover;object-position:50% 0;-webkit-mask-image:linear-gradient(to right,transparent,#000 10%,#000 90%,transparent),linear-gradient(to bottom,transparent,#000 14%);-webkit-mask-composite:source-in;mask-image:linear-gradient(to right,transparent,#000 10%,#000 90%,transparent),linear-gradient(to bottom,transparent,#000 14%);mask-composite:intersect}
.ports{display:flex;gap:.4rem;padding-block:1rem;border-top:1px solid #38414b;margin-top:0}
.ports i{width:1.15rem;height:.85rem;border-radius:2px;background:var(--port-off);border-bottom:3px solid #2c343c}
.ports i.on{background:var(--accent);border-bottom-color:#8f3406}
@media (min-width:56rem){
  .hero-grid{grid-template-columns:1.15fr .85fr;gap:3rem;padding-top:3.5rem}
  .hero-copy{padding-bottom:3rem}
  .hero-photo{max-width:28rem;justify-self:end}
}
@media (prefers-reduced-motion:no-preference){
  .ports i.on{animation:blink 2.6s infinite steps(1)}
  .ports i.on:nth-child(3n){animation-delay:.9s}
  .ports i.on:nth-child(3n+1){animation-delay:1.7s}
}
@keyframes blink{0%,86%{opacity:1}90%,96%{opacity:.35}100%{opacity:1}}

/* sections */
.sec{padding-block:3.5rem}
.sec.alt{background:var(--surface);border-block:1px solid var(--line)}
.sec-head{display:flex;flex-direction:column;gap:.5rem;margin-bottom:2rem;max-width:40rem}
.sec-head .mono{color:var(--accent-text)}
.sec-head h2{font-size:clamp(1.8rem,5.5vw,2.6rem);font-weight:700;letter-spacing:-.01em}
.sec-head p{color:var(--muted)}

.about{display:grid;gap:2rem}
.about figure{margin:0}
.about img{display:block;width:100%;height:auto;max-width:22rem;aspect-ratio:4/5;object-fit:cover;object-position:50% 18%;border-radius:.4rem}
.about-text{display:flex;flex-direction:column;gap:1rem;min-width:0;max-width:38rem}
.about-text p{font-size:1.1rem}
.facts{display:grid;grid-template-columns:auto 1fr;gap:.5rem 1.2rem;margin:.5rem 0 0;padding-top:1rem;border-top:1px solid var(--line)}
.facts dt{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-top:.2rem}
.facts dd{margin:0}
@media (min-width:48rem){.about{grid-template-columns:22rem 1fr;gap:3.5rem;align-items:start}}

.svc-grid{display:grid;gap:1.5rem}
@media (min-width:48rem){.svc-grid{grid-template-columns:1fr 1fr}}
.svc{background:var(--bg);border:1px solid var(--line);border-radius:.4rem;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.svc img{display:block;width:100%;height:auto;aspect-ratio:16/10;object-fit:cover}
#svc-web img{object-position:30% 30%}
#svc-net img{object-position:50% 25%}
.svc-body{display:flex;flex-direction:column;gap:.9rem;padding:1.3rem 1.3rem 1.5rem;flex:1}
.svc h3{font-size:1.5rem}
.svc p{color:var(--muted)}
.svc ul{margin:0;padding:0;list-style:none;display:grid;gap:.45rem}
.svc li{position:relative;padding-left:1.4rem}
.svc li::before{content:"";position:absolute;left:0;top:.62em;width:.7rem;height:.5rem;border-radius:1px;background:var(--accent);border-bottom:2px solid var(--accent-text)}
.svc .btn{align-self:flex-start;margin-top:auto}
.price-note{margin-top:1.5rem;color:var(--muted)}

.cards{display:grid;gap:1.25rem;grid-template-columns:repeat(auto-fill,minmax(min(100%,18rem),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:.4rem;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.sec.alt .card{background:var(--bg)}
.card img{display:block;width:100%;height:auto;aspect-ratio:16/10;object-fit:cover}
.card-body{display:flex;flex-direction:column;gap:.6rem;padding:1.1rem 1.2rem 1.3rem;flex:1}
.card h3{font-size:1.25rem;overflow-wrap:anywhere}
.card p{color:var(--muted);overflow-wrap:anywhere}
.card .row{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:auto;padding-top:.4rem}
.empty{border:1px dashed var(--line);border-radius:.4rem;padding:1.6rem;color:var(--muted);max-width:34rem}
.empty strong{display:block;color:var(--ink);font-family:var(--f-display);font-size:1.2rem;margin-bottom:.3rem}

.feed{display:grid;gap:1.25rem;max-width:44rem}
.post{background:var(--bg);border:1px solid var(--line);border-radius:.4rem;overflow:hidden;min-width:0}
.sec:not(.alt) .post{background:var(--surface)}
.post img{display:block;width:100%;height:auto;max-height:22rem;object-fit:cover}
.post-body{display:flex;flex-direction:column;gap:.7rem;padding:1.2rem 1.3rem 1.4rem}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:.7rem;color:var(--muted)}
.tag{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;padding:.2rem .55rem;border-radius:.25rem;border:1px solid var(--line);color:var(--ink)}
.tag.ad{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.post h3{font-size:1.4rem;overflow-wrap:anywhere}
.post .txt{display:grid;gap:.6rem;overflow-wrap:anywhere}
.post .row{display:flex;flex-wrap:wrap;gap:.6rem}

.order-grid{display:grid;gap:2rem}
@media (min-width:56rem){.order-grid{grid-template-columns:1.2fr .8fr;gap:3rem;align-items:start}}
.form{display:grid;gap:1rem;background:var(--surface);border:1px solid var(--line);border-radius:.4rem;padding:1.3rem;min-width:0}
.sec.alt .form{background:var(--bg)}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:.5rem;overflow:hidden}
.seg button{padding:.7rem;border:0;background:transparent;color:var(--muted);font:600 .95rem var(--f-body);cursor:pointer}
.seg button.on{background:var(--ink);color:var(--bg)}
label{display:block;font-weight:600;font-size:.92rem;margin-bottom:.3rem}
input,select,textarea{width:100%;font:400 1rem var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:.4rem;padding:.7rem .8rem}
.sec.alt input,.sec.alt select,.sec.alt textarea{background:var(--surface)}
textarea{resize:vertical;min-height:7rem}
.note{font-size:.88rem;color:var(--muted)}
.hint{font-size:.9rem;color:var(--accent-text);font-weight:600;min-height:1.3em}
.direct{display:grid;gap:1.2rem;min-width:0}
.direct h3{font-size:1.3rem}
.line{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .8rem;padding-block:.8rem;border-top:1px solid var(--line)}
.line .k{flex:0 0 100%;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.line .v{font-size:1.1rem;font-weight:600;overflow-wrap:anywhere;user-select:all;min-width:0}
.copy{font:600 .82rem var(--f-body);padding:.3rem .7rem;border:1px solid var(--line);border-radius:.35rem;background:var(--surface);color:var(--ink);cursor:pointer}

.contact{display:grid;gap:2rem;align-items:center}
.contact img{display:block;width:100%;height:auto;max-width:26rem;aspect-ratio:1/1;object-fit:cover;object-position:60% 25%;border-radius:.4rem}
@media (min-width:48rem){.contact{grid-template-columns:26rem 1fr;gap:3.5rem}}

footer{padding-block:2rem 6rem;border-top:1px solid var(--line);color:var(--muted);font-size:.9rem}
footer .wrap{display:flex;flex-wrap:wrap;gap:.5rem 1.5rem;justify-content:space-between}

/* floating buttons */
.wa-float{position:fixed;z-index:25;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 6px 18px rgb(0 0 0 / .25)}
.own-float{position:fixed;z-index:25;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border-color:var(--ink);box-shadow:0 6px 18px rgb(0 0 0 / .25)}

/* owner panel */
.panel{position:fixed;inset:0;z-index:50;background:rgb(10 12 16 / .6);display:flex;justify-content:flex-end}
.sheet{background:var(--bg);color:var(--ink);width:100%;max-width:40rem;height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.ph{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1rem max(16px,env(safe-area-inset-right,0px)) .6rem max(16px,env(safe-area-inset-left,0px))}
.ph h2{font-size:1.4rem}
.tabs{display:flex;gap:.3rem;overflow-x:auto;padding:0 max(16px,env(safe-area-inset-right,0px)) .6rem max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.tabs button{white-space:nowrap;border:0;background:transparent;color:var(--muted);font:600 .95rem var(--f-body);padding:.5rem .8rem;border-radius:.4rem;cursor:pointer}
.tabs button.on{background:var(--ink);color:var(--bg)}
.pbody{flex:1;overflow-y:auto;padding:1rem max(16px,env(safe-area-inset-right,0px)) 2rem max(16px,env(safe-area-inset-left,0px));display:grid;gap:1rem;align-content:start}
.pbody .item{border:1px solid var(--line);border-radius:.4rem;background:var(--surface);padding:1rem;display:grid;gap:.8rem}
.pbody .item-h{display:flex;justify-content:space-between;align-items:center;gap:1rem;font-weight:700}
.pbody .two{display:grid;gap:.8rem}
@media (min-width:36rem){.pbody .two{grid-template-columns:1fr 1fr}}
.pbody .thumb{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
.pbody .thumb img{width:6rem;height:4rem;object-fit:cover;border-radius:.3rem;border:1px solid var(--line)}
.pbody .chk{display:flex;gap:.6rem;align-items:center;font-weight:600}
.pbody .chk input{width:auto}
.pbody .help{color:var(--muted);font-size:.92rem}
.pfoot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.8rem;padding:.8rem max(16px,env(safe-area-inset-right,0px)) .8rem max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);background:var(--surface)}
.pstatus{font-size:.92rem;color:var(--muted);flex:1 1 12rem}
.pstatus.err{color:var(--accent-text);font-weight:600}
</style>

function updateOrder(){
  var P=S.profile,first=P.name.split(' ')[0];
  var n=($('of-name')||{}).value||'',m=($('of-msg')||{}).value||'',sv=($('of-svc')||{}).value||'';
  var ok=n.trim()&&m.trim();
  var t=mode==='order'
    ?'Hello '+first+', I would like to order: '+sv+'.\nName: '+n.trim()+'\nDetails: '+m.trim()
    :'Hello '+first+', I have a question.\nName: '+n.trim()+'\nQuestion: '+m.trim();
  var a=$('of-send');
  a.href=ok?waLink(t):'#order';
  a.setAttribute('aria-disabled',ok?'false':'true');
  $('of-hint').textContent='';
}
function setMode(m){
  mode=m;
  document.querySelectorAll('[data-mode]').forEach(function(b){b.classList.toggle('on',b.dataset.mode===m)});
  $('of-svc-wrap').hidden=(m!=='order');
  $('of-msg-l').textContent=m==='order'?'Details of your project':'Your question';
  $('of-msg').placeholder=m==='order'?'What do you need, and by when?':'What would you like to know?';
  updateOrder();
}

/* ---------- owner panel ---------- */
function setPath(o,p,v){var k=p.split('.');for(var i=0;i<k.length-1;i++){o=o[k[i]]}o[k[k.length-1]]=v}
function fi(label,path,val,o){o=o||{};var id='f-'+path.replace(/\./g,'-');
  var c=o.area?'<textarea id="'+id+'" rows="'+(o.rows||4)+'" data-k="'+path+'"'+(o.lines?' data-lines="1"':'')+'>'+esc(val)+'</textarea>'
    :'<input id="'+id+'" data-k="'+path+'" value="'+esc(val)+'"'+(o.type?' type="'+o.type+'"':'')+(o.ph?' placeholder="'+esc(o.ph)+'"':'')+'>';
  return '<div><label for="'+id+'">'+esc(label)+'</label>'+c+'</div>'}
function imgf(label,path,val){var id='u-'+path.replace(/\./g,'-');
  return '<div><label for="'+id+'">'+esc(label)+'</label><div class="thumb">'+(val?'<img src="'+esc(val)+'" alt="">':'')+'<input id="'+id+'" type="file" accept="image/*" data-up="'+path+'" style="width:auto;max-width:100%">'+(val?'<button type="button" class="btn sm ghost" data-act="clr" data-k="'+path+'">Remove photo</button>':'')+'</div></div>'}
function panelBody(){
  var h='';
  if(tab==='updates'){
    h+='<p class="help">Posts and adverts show on your site, newest first. Press Save and publish when you are done.</p><button type="button" class="btn" data-act="add-post">Add a post or advert</button>';
    draft.posts.forEach(function(p,i){var k='posts.'+i+'.';
      h+='<div class="item"><div class="item-h"><span>'+esc(p.title||'New item')+'</span><button type="button" class="btn sm ghost" data-act="del" data-list="posts" data-i="'+i+'">Delete</button></div>'
       +'<div class="two"><div><label for="f-posts-'+i+'-type">Type</label><select id="f-posts-'+i+'-type" data-k="'+k+'type"><option value="post"'+(p.type==='post'?' selected':'')+'>Post</option><option value="ad"'+(p.type==='ad'?' selected':'')+'>Advert</option></select></div>'+fi('Date',k+'date',p.date,{type:'date'})+'</div>'
       +fi('Title',k+'title',p.title)+fi('Message',k+'body',p.body,{area:1,rows:5})
       +'<div class="two">'+fi('Link (optional)',k+'link',p.link,{ph:'https://'})+fi('Link button text',k+'linkLabel',p.linkLabel,{ph:'Visit the site'})+'</div>'
       +imgf('Photo (optional)',k+'image',p.image)+'</div>';
    });
  }else if(tab==='websites'){
    h+='<p class="help">Websites you have built. Each shows a photo, a short description and a link.</p><button type="button" class="btn" data-act="add-site">Add a website</button>';
    draft.projects.forEach(function(p,i){var k='projects.'+i+'.';
      h+='<div class="item"><div class="item-h"><span>'+esc(p.name||'New website')+'</span><button type="button" class="btn sm ghost" data-act="del" data-list="projects" data-i="'+i+'">Delete</button></div>'
       +fi('Website name',k+'name',p.name)+fi('Address',k+'url',p.url,{ph:'https://example.com'})+fi('Short description',k+'desc',p.desc,{area:1,rows:3})+imgf('Screenshot or photo',k+'image',p.image)+'</div>';
    });
  }else if(tab==='services'){
    h+='<p class="help">Write one point per line.</p>';
    draft.services.forEach(function(s,i){var k='services.'+i+'.';
      h+='<div class="item">'+fi('Heading',k+'title',s.title)+fi('One-line summary',k+'intro',s.intro)+fi('Points (one per line)',k+'items',s.items.join('\n'),{area:1,rows:5,lines:1})+'</div>';
    });
    h+='<div class="item">'+fi('Price note',  'profile.priceNote',draft.profile.priceNote,{area:1,rows:2})+'</div>';
  }else{
    var P=draft.profile;
    h+='<div class="item"><label class="chk"><input type="checkbox" data-k="profile.available"'+(P.available?' checked':'')+'> I am taking new projects</label>'
     +fi('Line above your name','profile.kicker',P.kicker)+fi('Tagline under your name','profile.tagline',P.tagline,{area:1,rows:2})
     +fi('About me (blank line between paragraphs)','profile.about',P.about,{area:1,rows:7})
     +fi('WhatsApp number with country code, digits only','profile.whatsapp',P.whatsapp)+fi('Email','profile.email',P.email)+'</div>';
  }
  return h;
}
function panelHtml(){
  var T=[['updates','Posts and ads'],['websites','Websites'],['services','Services'],['profile','Profile']];
  return '<div class="sheet"><div class="ph"><h2>Edit my site</h2><button type="button" class="btn sm ghost" data-act="close">Close</button></div>'
   +'<div class="tabs" role="tablist">'+T.map(function(t){return '<button type="button" role="tab" data-act="tab" data-tab="'+t[0]+'" class="'+(tab===t[0]?'on':'')+'">'+t[1]+'</button>'}).join('')+'</div>'
   +'<div class="pbody" id="pbody">'+panelBody()+'</div>'
   +'<div class="pfoot"><span class="pstatus" id="pstatus" aria-live="polite"></span><button type="button" class="btn" data-act="save">Save and publish</button></div></div>';
}
function paintPanel(keep){var el=$('panel');if(!el)return;var st=($('pbody')||{}).scrollTop||0;var s=($('pstatus')||{}).textContent||'';el.innerHTML=panelHtml();if(keep){$('pbody').scrollTop=st}$('pstatus').textContent=s}
function setStatus(t,err){var e=$('pstatus');if(!e)return;e.textContent=t;e.className='pstatus'+(err?' err':'')}
function openPanel(){
  draft=JSON.parse(JSON.stringify(S));
  var el=document.createElement('div');el.id='panel';el.className='panel';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');el.setAttribute('aria-label','Edit my site');
  document.body.appendChild(el);paintPanel(false);
}
function closePanel(){var el=$('panel');if(el)el.remove();draft=null}
function toBlob(file,max){return new Promise(function(res,rej){var img=new Image(),u=URL.createObjectURL(file);
  img.onload=function(){var r=Math.min(1,max/Math.max(img.width,img.height));var c=document.createElement('canvas');c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(function(b){b?res(b):rej(new Error('Could not read that photo.'))},'image/jpeg',.82)};
  img.onerror=function(){rej(new Error('That file is not a photo I can read.'))};img.src=u})}
async function onUpload(t){
  var f=t.files&&t.files[0];if(!f)return;
  setStatus('Uploading photo...');
  try{
    var A=await window.claude.use('assets');
    if(!A)throw new Error('Photo upload is not available here.');
    var b=await toBlob(f,1400);var r=await A.upload(b);
    setPath(draft,t.dataset.up,r.url);paintPanel(true);setStatus('Photo added. Press Save and publish to keep it.');
  }catch(err){setStatus('Could not upload: '+((err&&err.message)||'try a smaller photo.'),true)}
}
function buildDoc(s){
  var json=JSON.stringify(s).replace(/</g,'\\u003c');
  return SKEL+$('pg-title').outerHTML+$('pg-meta').outerHTML+$('pg-fonts').outerHTML+$('pg-style').outerHTML
    +'<div id="app"></div><script id="pg-state" type="application/json">'+json+'</scr'+'ipt><script id="pg-main">'+$('pg-main').textContent+'</scr'+'ipt></body></html>';
}
async function save(){
  if(busy||!draft)return;busy=true;setStatus('Publishing...');
  try{
    draft.posts=draft.posts.filter(function(p){return (p.title||'').trim()||(p.body||'').trim()});
    draft.projects=draft.projects.filter(function(p){return (p.name||'').trim()});
    var art=await window.claude.use('artifact');
    if(!art)throw {code:'not_granted'};
    await art.publish(buildDoc(draft));
    setStatus('Published. The page is reloading.');
  }catch(err){
    var c=err&&err.code;
    setStatus(c==='conflict'?'The site was changed somewhere else and is reloading. Make your edit again.'
      :(c==='not_writer'||c==='not_granted')?'Only the site owner can publish changes.'
      :c==='too_large'?'The page is too large. Remove a big photo and try again.'
      :'Could not publish. Check your connection and try again.',true);
  }
  busy=false;
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest?e.target.closest('[data-act],[data-mode],[data-svc],[data-copy],[data-order],#of-send'):null;if(!t)return;
  if(t.id==='of-send'&&t.getAttribute('aria-disabled')==='true'){e.preventDefault();$('of-hint').textContent='Add your name and details first.';return}
  if(t.dataset.mode){setMode(t.dataset.mode);return}
  if(t.dataset.order!==undefined){setMode('order');return}
  if(t.dataset.svc){setMode('order');$('of-svc').value=t.dataset.svc;updateOrder();return}
  if(t.dataset.copy){var src=$(t.dataset.copy);var txt=src.textContent.replace(/\s/g,'');
    var fallback=function(){var r=document.createRange();r.selectNodeContents(src);var s=window.getSelection();s.removeAllRanges();s.addRange(r);t.textContent='Selected, press copy'};
    try{navigator.clipboard.writeText(t.dataset.copy==='c-em'?src.textContent:txt).then(function(){t.textContent='Copied';setTimeout(function(){t.textContent='Copy'},1500)},fallback)}catch(x){fallback()}return}
  var a=t.dataset.act;if(!a)return;
  if(a==='open'){openPanel();return}
  if(!draft&&a!=='close')return;
  if(a==='close'){closePanel();return}
  if(a==='tab'){tab=t.dataset.tab;paintPanel(false);return}
  if(a==='save'){save();return}
  if(a==='add-post'){draft.posts.unshift({id:uid(),type:'post',title:'',body:'',link:'',linkLabel:'Learn more',image:'',date:new Date().toISOString().slice(0,10)});paintPanel(false);return}
  if(a==='add-site'){draft.projects.unshift({id:uid(),name:'',url:'',desc:'',image:''});paintPanel(false);return}
  if(a==='del'){draft[t.dataset.list].splice(+t.dataset.i,1);paintPanel(true);return}
  if(a==='clr'){setPath(draft,t.dataset.k,'');paintPanel(true);return}
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='of-name'||t.id==='of-msg'||t.id==='of-svc'){updateOrder();return}
  if(!draft||!t.dataset||!t.dataset.k||t.type==='file')return;
  var v=t.type==='checkbox'?t.checked:t.value;
  if(t.dataset.lines)v=v.split('\n').map(function(x){return x.trim()}).filter(Boolean);
  setPath(draft,t.dataset.k,v);
});
document.addEventListener('change',function(e){var t=e.target;if(t&&t.dataset&&t.dataset.up)onUpload(t)});
document.addEventListener('submit',function(e){e.preventDefault()});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&$('panel'))closePanel()});

render();setMode('order');
(async function(){
  try{
    if(!window.claude||!window.claude.use)return;
    var u=await window.claude.use('user');
    if(u&&await u.isOwner()){owner=true;var b=$('ownerBtn');if(b)b.hidden=false;document.querySelectorAll('.owner-only').forEach(function(n){n.hidden=false})}
  }catch(e){}
})();
})();
</script>
